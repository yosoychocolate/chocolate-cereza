# Push de pedidos de amizade — GRÁTIS (GitHub Actions + FCM, sem plano Blaze).
#
# Usa o mesmo secret FIREBASE_SERVICE_ACCOUNT do workflow "Daily charge push".
# Teste manual: Actions → Friend request push → Run workflow

name: Friend request push

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Send friend request pushes
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-friend-request-push.js
