name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Publica via push na branch gh-pages (evita fila deployment_queued da API do Pages).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          VERSION=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' \) \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './scripts/*' \
            ! -path './functions/*' \
            ! -path './node_modules/*' \
            -exec sed -i "s/__APP_VERSION__/${VERSION}/g" {} +

          printf '{"version":"%s","builtAt":"%s"}\n' "$VERSION" "$BUILD_TIME" > version.json

          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'functions' \
            --exclude 'scripts' \
            --exclude 'node_modules' \
            --exclude '.cursor' \
            --exclude '_site' \
            ./ _site/

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
