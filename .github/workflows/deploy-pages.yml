name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Só um workflow por vez — evita 2 deploys simultâneos no Pages.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          VERSION=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' \) \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './scripts/*' \
            ! -path './functions/*' \
            ! -path './node_modules/*' \
            -exec sed -i "s/__APP_VERSION__/${VERSION}/g" {} +

          printf '{"version":"%s","builtAt":"%s"}\n' "$VERSION" "$BUILD_TIME" > version.json

          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'functions' \
            --exclude 'scripts' \
            --exclude 'node_modules' \
            --exclude '.cursor' \
            --exclude '_site' \
            ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages deployment slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verificando se há deploy anterior do Pages ainda em andamento..."
          for attempt in $(seq 1 45); do
            json=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments?per_page=1" 2>/dev/null || echo '[]')
            status=$(echo "$json" | jq -r '.[0].status // "none"')
            deploy_id=$(echo "$json" | jq -r '.[0].id // ""')
            echo "Tentativa ${attempt}/45 — último deploy: ${deploy_id:-n/a} status=${status}"

            if [ "$status" = "none" ] || [ "$status" = "success" ] || [ "$status" = "failure" ]; then
              echo "Slot livre — pode publicar."
              exit 0
            fi

            # Deploy preso na fila por muito tempo — cancela para liberar.
            if [ "$status" = "queued" ] && [ "$attempt" -ge 8 ]; then
              echo "Cancelando deploy enfileirado preso: ${deploy_id}"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${deploy_id}/cancel" || true
              sleep 15
              continue
            fi

            sleep 20
          done

          echo "::error::Pages ainda ocupado após 15 min. Cancele manualmente em Settings → Pages ou aguarde."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
